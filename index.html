<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>new audit · v4</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<meta name="description" content="نيو أوديت — نسخة v4 بناءً على ملاحظات يزن من اجتماع 2026-05-18" />
<meta name="theme-color" content="#1F4636" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  /* Surfaces — cream paper feel (Yazan validated these in v3) */
  --paper: #F4EFE3;
  --surface: #FCF8EE;
  --surface-2: #F8F1DD;
  --sunken: #E8DEC5;
  --rule: #D9CFB6;
  --rule-strong: #B8A981;

  /* Ink */
  --ink: #241D14;
  --ink-2: #4F4631;
  --ink-3: #786E54;
  --ink-mute: #A59879;

  /* Brand — deep audit-firm green */
  --brand: #1F4636;
  --brand-2: #143025;
  --brand-3: #0B1F18;
  --brand-soft: #DCE7E0;
  --brand-tint: rgba(31, 70, 54, 0.08);

  /* Gold accent — for locks, seals, ledger lines */
  --gold: #B8954A;
  --gold-deep: #8A6D2F;
  --gold-soft: #F0E3C7;
  --gold-tint: rgba(184, 149, 74, 0.14);

  /* Status */
  --status-ok: #1E6D52;
  --status-ok-soft: #D6E8DE;
  --status-warn: #B17324;
  --status-warn-soft: #F4E1BE;
  --status-bad: #A33A2E;
  --status-bad-soft: #F0D4CE;
  --status-info: #2C5D8F;
  --status-info-soft: #DDE7F1;

  /* Type */
  --sans: "IBM Plex Sans Arabic", "Noto Naskh Arabic", system-ui, sans-serif;
  --serif: "Amiri", "Noto Naskh Arabic", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--paper); }
body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(circle at 0% 0%, rgba(184, 149, 74, 0.05), transparent 40%),
    radial-gradient(circle at 100% 0%, rgba(31, 70, 54, 0.04), transparent 40%),
    var(--paper);
  min-height: 100vh;
  line-height: 1.5;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--brand); text-decoration: none; }
a:hover { color: var(--brand-2); text-decoration: underline; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(180deg, var(--brand) 0%, var(--brand-2) 100%);
  color: #F3EBD3;
  border-bottom: 1px solid var(--gold);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 18px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.08);
}
.topbar .logo {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--serif); font-size: 24px; font-weight: 700;
  color: var(--gold-soft); letter-spacing: 0.5px;
}
.topbar .logo small { font-family: var(--sans); font-size: 11px; color: rgba(243, 235, 211, 0.6); font-weight: 500; letter-spacing: 1.5px; }
.topbar .spacer { flex: 1; }
.topbar .date-block { display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; line-height: 1.3; color: rgba(243, 235, 211, 0.85); font-family: var(--mono); }
.topbar .date-block .hijri { color: var(--gold-soft); }
.topbar .user { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border: 1px solid rgba(243, 235, 211, 0.18); border-radius: 999px; font-size: 13px; }
.topbar .user .role { color: var(--gold-soft); font-size: 11px; opacity: 0.85; }
.topbar nav { display: flex; gap: 6px; }
.topbar nav a { color: rgba(243, 235, 211, 0.75); font-size: 13px; padding: 6px 12px; border-radius: 6px; }
.topbar nav a.active, .topbar nav a:hover { background: rgba(243, 235, 211, 0.1); color: #FCF8EE; text-decoration: none; }
.topbar .logout {
  background: transparent; border: 1px solid rgba(243, 235, 211, 0.25);
  color: rgba(243, 235, 211, 0.85); padding: 6px 14px; border-radius: 6px;
  font-size: 12px;
}
.topbar .logout:hover { background: rgba(243, 235, 211, 0.1); }

/* ---------- Crumb / sub-bar ---------- */
.subbar {
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px;
}
.subbar .crumb { color: var(--ink-3); }
.subbar .crumb a { color: var(--ink-2); }
.subbar .crumb .sep { margin: 0 6px; color: var(--ink-mute); }
.subbar .spacer { flex: 1; }
.subbar .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* ---------- Page shells ---------- */
.page { max-width: 1280px; margin: 0 auto; padding: 28px 32px 80px; }
.page-narrow { max-width: 880px; }
.page-mid { max-width: 1060px; }

h1.page-title { font-family: var(--serif); font-size: 30px; line-height: 1.2; margin: 0 0 6px; color: var(--brand-2); font-weight: 700; }
h1.page-title small { display: block; font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink-3); margin-top: 6px; }

h2.section-title { font-family: var(--serif); font-size: 22px; margin: 28px 0 10px; color: var(--brand-2); font-weight: 700; }
h3.sub-title { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 16px 0 8px; letter-spacing: -0.005em; }

/* ---------- Cards / sheets ---------- */
.sheet {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 22px 26px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 2px 8px rgba(0,0,0,0.04);
  margin: 0 0 18px;
}
.sheet.tight { padding: 14px 18px; }
.sheet h3 { margin-top: 0; }

.subtle { color: var(--ink-3); font-size: 13px; }

/* ---------- Form inputs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.02em; }
.field input, .field select, .field textarea {
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 9px 12px;
  font-size: 14px;
  color: var(--ink);
  transition: border-color 0.15s, background 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--brand);
  background: #FFFCF5;
  box-shadow: 0 0 0 3px var(--brand-tint);
}
.field .hint { font-size: 11px; color: var(--ink-mute); }
.field-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.field-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 720px) { .field-row, .field-row-3 { grid-template-columns: 1fr; } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--brand); color: #FCF8EE;
  border: 1px solid var(--brand-2);
  padding: 9px 18px; border-radius: 6px;
  font-size: 14px; font-weight: 600;
  transition: background 0.15s, transform 0.05s;
}
.btn:hover { background: var(--brand-2); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--brand); border-color: var(--rule-strong); }
.btn.ghost:hover { background: var(--brand-tint); }
.btn.gold { background: var(--gold); border-color: var(--gold-deep); }
.btn.gold:hover { background: var(--gold-deep); }
.btn.danger { background: var(--status-bad); border-color: #7A2A20; }
.btn.danger:hover { background: #7A2A20; }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }

/* ---------- Status pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1.5; }
.pill.ok { background: var(--status-ok-soft); color: var(--status-ok); }
.pill.warn { background: var(--status-warn-soft); color: var(--status-warn); }
.pill.bad { background: var(--status-bad-soft); color: var(--status-bad); }
.pill.info { background: var(--status-info-soft); color: var(--status-info); }
.pill.gold { background: var(--gold-tint); color: var(--gold-deep); }
.pill.muted { background: var(--sunken); color: var(--ink-3); }

/* ---------- Login ---------- */
.login-page {
  min-height: 100vh; display: grid; place-items: center;
  background:
    radial-gradient(circle at 30% 20%, rgba(184, 149, 74, 0.10), transparent 35%),
    radial-gradient(circle at 70% 80%, rgba(31, 70, 54, 0.08), transparent 35%),
    var(--paper);
  padding: 40px 24px;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 12px;
  width: 100%; max-width: 440px;
  padding: 36px 36px 28px;
  box-shadow: 0 8px 28px rgba(20, 48, 37, 0.10), 0 1px 0 var(--gold-soft);
  position: relative;
}
.login-card::before {
  content: ""; position: absolute; inset: 0; border-radius: 12px;
  border: 1px solid var(--gold);
  margin: 4px; opacity: 0.45; pointer-events: none;
}
.login-brand { text-align: center; margin-bottom: 26px; }
.login-brand h1 { font-family: var(--serif); font-size: 38px; margin: 6px 0; color: var(--brand-2); letter-spacing: 1px; }
.login-brand small { color: var(--gold-deep); font-family: var(--mono); font-size: 11px; letter-spacing: 2px; }
.login-card .field input { padding: 11px 14px; font-size: 15px; }
.login-meta { text-align: center; margin-top: 18px; font-size: 12px; color: var(--ink-mute); }
.login-meta button { background: none; border: 0; color: var(--brand); text-decoration: underline; font-size: 12px; padding: 0; }

/* ---------- Dashboard ---------- */
.dash-toolbar {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 20px;
}
.dash-toolbar .filter-group { display: flex; align-items: center; gap: 8px; }
.dash-toolbar label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.dash-toolbar select, .dash-toolbar input {
  background: var(--surface-2); border: 1px solid var(--rule);
  padding: 6px 12px; border-radius: 6px; font-size: 13px;
}
.dash-toolbar .spacer { flex: 1; }
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.kpi {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 16px 18px;
}
.kpi .label { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }
.kpi .value { font-family: var(--serif); font-size: 32px; line-height: 1.1; color: var(--brand-2); margin-top: 4px; font-weight: 700; }
.kpi .delta { font-size: 11px; color: var(--ink-mute); margin-top: 2px; }
@media (max-width: 800px) { .kpi-row { grid-template-columns: 1fr 1fr; } }

.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.client-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 18px 20px;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  position: relative;
}
.client-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(20, 48, 37, 0.10); border-color: var(--rule-strong); }
.client-card h3 { margin: 0 0 4px; font-size: 16px; color: var(--brand-2); font-weight: 700; }
.client-card .en { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
.client-card .meta-row { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.client-card .meta-row span { display: flex; align-items: center; gap: 4px; }
.client-card .pills { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.client-card .add-icon {
  position: absolute; inset-inline-end: 12px; inset-block-start: 12px;
  color: var(--ink-mute); font-size: 16px;
}
.client-card.add-new {
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
  border: 2px dashed var(--rule-strong);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 140px; color: var(--brand-2);
}
.client-card.add-new:hover { border-color: var(--brand); color: var(--brand-2); background: var(--brand-tint); }
.client-card.add-new .plus { font-size: 36px; line-height: 1; margin-bottom: 4px; color: var(--brand); }
.client-card.add-new .label { font-weight: 700; font-size: 15px; }

.empty {
  background: var(--surface); border: 1px dashed var(--rule-strong);
  border-radius: 10px; padding: 40px 24px; text-align: center;
}
.empty .icon { font-size: 36px; color: var(--ink-mute); margin-bottom: 12px; }
.empty h3 { margin: 0 0 6px; color: var(--brand-2); }
.empty p { color: var(--ink-3); margin: 0 auto 18px; max-width: 480px; }

/* ---------- TB import / mapping ---------- */
.steps { display: flex; gap: 6px; margin-bottom: 18px; }
.steps .step {
  flex: 1; padding: 10px 14px; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 8px; font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 10px;
}
.steps .step.active { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-2); }
.steps .step.done { background: var(--status-ok-soft); border-color: var(--status-ok); color: var(--status-ok); }
.steps .step .num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--sunken);
  display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
}
.steps .step.active .num { background: var(--brand); color: #FCF8EE; }
.steps .step.done .num { background: var(--status-ok); color: #FCF8EE; }

.tb-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border-radius: 8px; overflow: hidden; }
.tb-table thead th {
  background: var(--surface-2); border-bottom: 1px solid var(--rule);
  padding: 10px 12px; font-size: 11px; font-weight: 700; text-align: start;
  color: var(--ink-2); letter-spacing: 0.05em; text-transform: uppercase;
}
.tb-table tbody td { padding: 8px 12px; border-bottom: 1px solid var(--rule); font-size: 13px; }
.tb-table tbody tr:last-child td { border-bottom: 0; }
.tb-table tbody tr:hover { background: var(--surface-2); }
.tb-table td.code { font-family: var(--mono); color: var(--ink-3); font-size: 12px; }
.tb-table td.num { font-family: var(--mono); text-align: end; font-size: 13px; }
.tb-table td.num.zero { color: var(--ink-mute); }
.tb-table td.mapping select {
  width: 100%; max-width: 280px; background: var(--surface-2);
  border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px; font-size: 12px;
}
.tb-table td.mapping select.unmapped { border-color: var(--status-warn); background: var(--status-warn-soft); }
.tb-table td.mapping select.mapped { border-color: var(--status-ok); background: var(--status-ok-soft); }
.tb-table tfoot td { padding: 10px 12px; font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--rule-strong); }

.upload-zone {
  border: 2px dashed var(--rule-strong); border-radius: 10px;
  padding: 36px 24px; text-align: center; background: var(--surface);
  transition: background 0.15s, border-color 0.15s;
}
.upload-zone:hover { background: var(--surface-2); border-color: var(--brand); }
.upload-zone .icon { font-size: 40px; color: var(--ink-mute); margin-bottom: 10px; }
.upload-zone h4 { margin: 0 0 6px; font-size: 16px; color: var(--brand-2); }
.upload-zone p { margin: 0 0 16px; color: var(--ink-3); font-size: 13px; }

/* ---------- Planning tree (vertical accordion) ---------- */
.tree { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.tree-node { border-bottom: 1px solid var(--rule); }
.tree-node:last-child { border-bottom: 0; }
.tree-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; cursor: pointer; transition: background 0.12s;
}
.tree-row:hover { background: var(--surface-2); }
.tree-row.open { background: var(--brand-tint); }
.tree-row .twist {
  width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3); transition: transform 0.18s;
}
.tree-row.open .twist { transform: rotate(90deg); color: var(--brand-2); }
.tree-row .label {
  flex: 1; font-weight: 600; color: var(--ink); font-size: 15px;
  display: flex; align-items: center; gap: 10px;
}
.tree-row .label .badge { background: var(--gold-soft); color: var(--gold-deep); font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 700; font-family: var(--mono); }
.tree-row .progress { font-size: 11px; color: var(--ink-3); font-family: var(--mono); direction: ltr; unicode-bidi: isolate; }
.tree-row .progress strong { color: var(--brand); }
.sub-node .progress, .progress.code { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.tree-body { padding: 0 20px 18px 56px; display: none; }
.tree-row.open + .tree-body { display: block; }

.sub-tree { background: var(--surface-2); border-radius: 8px; padding: 8px; margin-top: 6px; }
.sub-node { padding: 10px 14px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.sub-node:hover { background: var(--surface); }
.sub-node.open { background: var(--surface); border: 1px solid var(--rule); }
.sub-node .twist { color: var(--ink-mute); width: 16px; }
.sub-node.open .twist { transform: rotate(90deg); }
.sub-node-label { flex: 1; font-size: 14px; color: var(--ink-2); font-weight: 500; }
.sub-body { padding: 12px 16px 6px; display: none; }
.sub-node.open + .sub-body { display: block; }

/* ---------- IC question rows (the dropdown UX) ---------- */
.ic-list { display: flex; flex-direction: column; gap: 8px; }
.ic-question {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 12px 16px;
}
.ic-question.answered-yes { border-inline-start: 3px solid var(--status-ok); }
.ic-question.answered-no  { border-inline-start: 3px solid var(--status-bad); }
.ic-question.answered-na  { border-inline-start: 3px solid var(--ink-mute); }
.ic-q-top { display: flex; align-items: flex-start; gap: 12px; }
.ic-q-text { flex: 1; font-size: 14px; line-height: 1.55; color: var(--ink); }
.ic-q-num { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); min-width: 32px; }
.ic-answer {
  position: relative;
  min-width: 130px;
}
.ic-answer select {
  width: 100%; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--rule); color: var(--ink-2);
  cursor: pointer; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(0% + 10px) 50%, calc(0% + 14px) 50%;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  padding-inline-start: 26px;
}
.ic-answer select.yes { background-color: var(--status-ok-soft); border-color: var(--status-ok); color: var(--status-ok); }
.ic-answer select.no  { background-color: var(--status-bad-soft); border-color: var(--status-bad); color: var(--status-bad); }
.ic-answer select.na  { background-color: var(--surface-2); border-color: var(--ink-mute); color: var(--ink-3); }
.ic-q-bottom { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule); gap: 16px; align-items: flex-start; }
.ic-question.answered-yes .ic-q-bottom { display: flex; }
.ic-q-bottom .upload-slot {
  flex: 1;
  background: var(--surface-2);
  border: 1px dashed var(--rule-strong);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--ink-3);
  display: flex; align-items: center; gap: 10px;
}
.ic-q-bottom .upload-slot.has-file { background: var(--status-ok-soft); border-color: var(--status-ok); color: var(--status-ok); border-style: solid; }
.ic-q-bottom .upload-slot .file-icon { font-size: 18px; }
.ic-q-bottom .upload-slot input[type=file] { display: none; }
.ic-q-bottom .upload-slot .upload-btn {
  background: var(--brand); color: #FCF8EE; border: 0; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-inline-start: auto;
}
.ic-q-bottom .note-slot textarea {
  width: 240px; min-height: 38px; background: var(--surface-2); border: 1px solid var(--rule);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; resize: vertical;
}

/* ---------- Meeting minutes ---------- */
.meeting-section { margin-bottom: 14px; }
.meeting-section .heading { font-weight: 700; color: var(--brand-2); margin-bottom: 6px; font-size: 14px; }
.meeting-section textarea {
  width: 100%; min-height: 90px; padding: 10px 14px; font-size: 14px; line-height: 1.6;
  background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; resize: vertical;
}
.meeting-intro {
  background: var(--gold-tint); border-inline-start: 3px solid var(--gold);
  padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-style: italic;
  color: var(--ink-2); font-size: 13px;
}

/* ---------- Permanent file ---------- */
.entity-classes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.entity-class {
  border: 1px solid var(--rule); background: var(--surface-2);
  border-radius: 8px; padding: 12px 14px; cursor: pointer;
}
.entity-class:hover { background: var(--surface); border-color: var(--rule-strong); }
.entity-class.selected { background: var(--brand-tint); border-color: var(--brand); }
.entity-class .size { font-weight: 700; color: var(--brand-2); margin-bottom: 6px; font-size: 14px; }
.entity-class .criteria { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
@media (max-width: 720px) { .entity-classes { grid-template-columns: 1fr; } }

.pf-doc-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--rule);
  border-radius: 6px; margin-bottom: 8px;
}
.pf-doc-row.has-file { background: var(--status-ok-soft); border-color: var(--status-ok); }
.pf-doc-row .label { flex: 1; font-size: 13px; }
.pf-doc-row input[type=file] { display: none; }

/* ---------- Risk matrix ---------- */
.risk-empty {
  background: var(--surface); border: 1px dashed var(--rule-strong);
  border-radius: 8px; padding: 28px 18px; text-align: center; color: var(--ink-3);
}
.risk-section { margin-bottom: 22px; }
.risk-section h3 { font-family: var(--serif); color: var(--brand-2); font-size: 18px; margin-bottom: 6px; }
.risk-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.risk-table thead th {
  background: var(--brand); color: var(--gold-soft);
  padding: 8px 10px; font-size: 11px; font-weight: 700; text-align: start;
}
.risk-table tbody td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.risk-table tbody tr.acct-row td { background: var(--surface-2); font-weight: 700; color: var(--brand-2); }
.severity { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; font-family: var(--mono); }
.severity.H { background: var(--status-bad-soft); color: var(--status-bad); }
.severity.M { background: var(--status-warn-soft); color: var(--status-warn); }
.severity.L { background: var(--status-ok-soft); color: var(--status-ok); }

/* ---------- Misc helpers ---------- */
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.mt-8 { margin-top: 8px; } .mt-14 { margin-top: 14px; } .mt-24 { margin-top: 24px; }
.mb-0 { margin-bottom: 0; } .mb-8 { margin-bottom: 8px; }
.tnum { font-variant-numeric: tabular-nums; }
.code { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.callout {
  background: var(--gold-tint); border-inline-start: 3px solid var(--gold);
  padding: 12px 16px; border-radius: 6px; font-size: 13px; color: var(--ink-2);
}
.callout strong { color: var(--gold-deep); }

/* ============================================================
   POLISH PASS — 2026-05-20
   Refinements for the v4 shipping to Yazan.
   ============================================================ */

/* Subtle paper grain on the global background */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='1' seed='3'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.21  0 0 0 0.035 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.65; mix-blend-mode: multiply;
}
#app { position: relative; z-index: 1; }

/* ---------- Login refinement ---------- */
.login-page::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 18px, rgba(184, 149, 74, 0.04) 18px, rgba(184, 149, 74, 0.04) 19px),
    repeating-linear-gradient(-45deg, transparent, transparent 18px, rgba(31, 70, 54, 0.025) 18px, rgba(31, 70, 54, 0.025) 19px);
}
.login-card { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); background: rgba(252, 248, 238, 0.94); }
.login-card .brand-mark { width: 56px; height: 56px; border: 2px solid var(--gold); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--gold-deep); font-family: var(--serif); font-size: 22px; font-weight: 700; margin-bottom: 12px; background: var(--surface); position: relative; }
.login-card .brand-mark::after { content: ""; position: absolute; inset: -6px; border: 1px dashed var(--gold); border-radius: 50%; opacity: 0.4; }
.login-card .footer-note { margin-top: 26px; text-align: center; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.16em; text-transform: uppercase; border-top: 1px dashed var(--rule); padding-top: 16px; }

/* ---------- Topbar refinement ---------- */
.topbar { position: sticky; top: 0; z-index: 50; border-bottom: 0; }
.topbar::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 18%, var(--gold-deep) 50%, var(--gold) 82%, transparent 100%);
}
.topbar .logo span { letter-spacing: 1px; text-shadow: 0 1px 0 rgba(0,0,0,0.18); }
.topbar .user { background: rgba(11, 31, 24, 0.35); border-color: rgba(243, 235, 211, 0.16); }
.topbar .user:hover { background: rgba(11, 31, 24, 0.45); }

/* ---------- Workpaper header band (work papers + memos) ---------- */
.wp-header {
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--brand);
  border-radius: 0 0 8px 8px;
  padding: 14px 20px;
  margin-bottom: 18px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
  font-size: 12px;
}
.wp-header .firm { font-family: var(--serif); font-size: 16px; color: var(--brand-2); font-weight: 700; }
.wp-header .firm small { display: block; font-family: var(--sans); font-size: 10px; color: var(--ink-3); font-weight: 500; letter-spacing: 0.08em; }
.wp-header .center { text-align: center; }
.wp-header .center .isa { font-family: var(--mono); font-size: 10px; color: var(--gold-deep); letter-spacing: 0.18em; }
.wp-header .center .title { font-family: var(--serif); font-size: 18px; color: var(--ink); font-weight: 700; line-height: 1.2; }
.wp-header .meta { text-align: end; font-family: var(--mono); color: var(--ink-3); font-size: 11px; line-height: 1.5; }
.wp-header .meta strong { color: var(--ink); font-weight: 600; }
@media (max-width: 720px) { .wp-header { grid-template-columns: 1fr; text-align: center; } .wp-header .meta { text-align: center; } }

/* ---------- Dashboard refinement ---------- */
.client-card { overflow: hidden; }
.client-card::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0;
  width: 4px; background: var(--brand);
  transition: width 0.18s ease;
}
.client-card:hover::before { width: 7px; }
.client-card.activity-construction::before { background: var(--gold); }
.client-card.activity-service::before { background: var(--status-info); }
.client-card.activity-trade::before { background: var(--status-warn); }
.client-card.activity-industrial::before { background: var(--brand); }
.client-card h3 { display: flex; align-items: center; gap: 10px; }
.client-card .ar-mark { color: var(--gold-deep); font-family: var(--mono); font-size: 11px; opacity: 0.6; }
.client-card .meta-row .icon { color: var(--ink-mute); margin-inline-end: 4px; }

.kpi { position: relative; overflow: hidden; }
.kpi::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--brand) 0%, var(--gold) 100%);
  opacity: 0.35;
}
.kpi .micro { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 10px; color: var(--ink-mute); font-family: var(--mono); }

/* ---------- TB table refinement ---------- */
.tb-table { box-shadow: 0 1px 0 var(--rule), 0 4px 12px rgba(20, 48, 37, 0.05); }
.tb-table thead th { position: sticky; top: 0; z-index: 3; background: var(--surface-2); }
.tb-table tbody tr:nth-child(even) { background: rgba(232, 222, 197, 0.18); }
.tb-table tbody tr:hover { background: var(--brand-tint); }
.tb-table tfoot td { position: sticky; bottom: 0; background: var(--gold-soft); border-top: 2px solid var(--gold); }
.tb-table td.mapping select { transition: border-color 0.15s, background 0.15s; }

/* ---------- Planning tree refinement ---------- */
.tree-row { position: relative; transition: background 0.15s; }
.tree-row::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0;
  width: 3px; background: transparent; transition: background 0.15s;
}
.tree-row.open::before { background: var(--brand); }
.tree-row .twist { transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), color 0.15s; }
.tree-body { overflow: hidden; }
.tree-body.animating { transition: max-height 0.28s ease; }

/* Progress mini-bar */
.tree-row .progress { display: inline-flex; align-items: center; gap: 8px; direction: ltr; unicode-bidi: isolate; }
.tree-row .progress .mini-bar { width: 56px; height: 4px; background: var(--sunken); border-radius: 999px; overflow: hidden; display: inline-block; }
.tree-row .progress .mini-bar .fill { display: block; height: 100%; background: linear-gradient(90deg, var(--brand) 0%, var(--gold) 100%); transition: width 0.3s ease; }
.sub-node .progress { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ---------- IC question refinement ---------- */
.ic-list { gap: 10px; }
.ic-question { padding: 14px 18px; transition: background 0.15s, border-color 0.15s; }
.ic-question:hover { background: var(--surface-2); }
.ic-q-num {
  min-width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--rule);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--ink-3);
  font-family: var(--mono); flex-shrink: 0;
}
.ic-question.answered-yes .ic-q-num { background: var(--status-ok-soft); border-color: var(--status-ok); color: var(--status-ok); }
.ic-question.answered-no .ic-q-num  { background: var(--status-bad-soft); border-color: var(--status-bad); color: var(--status-bad); }
.ic-question.answered-na .ic-q-num  { background: var(--surface-2); border-color: var(--ink-mute); color: var(--ink-3); }
.ic-question.no-upload { border-color: var(--status-warn); }
.ic-question.no-upload .upload-slot { border-color: var(--status-warn); background: var(--status-warn-soft); color: var(--status-warn); border-style: solid; }
.ic-warn-pill {
  display: none; align-items: center; gap: 4px;
  background: var(--status-warn-soft); color: var(--status-warn);
  font-size: 10px; padding: 2px 8px; border-radius: 999px;
  font-weight: 700; margin-top: 6px;
}
.ic-question.no-upload .ic-warn-pill { display: inline-flex; }
.ic-answer select { transition: background 0.15s, border-color 0.15s; }

/* ---------- Permanent file polish ---------- */
.entity-class { position: relative; transition: transform 0.15s, box-shadow 0.15s; }
.entity-class:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(20, 48, 37, 0.06); }
.entity-class .icon { font-size: 24px; margin-bottom: 6px; display: block; }
.pf-doc-row { transition: background 0.15s, border-color 0.15s; }
.pf-doc-row:hover { background: var(--surface); }
.pf-doc-row .file-type {
  width: 30px; height: 36px; border-radius: 3px; background: var(--surface);
  border: 1px solid var(--rule-strong); display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--brand-2);
  position: relative;
}
.pf-doc-row .file-type::before {
  content: ""; position: absolute; top: 0; inset-inline-end: 0;
  border-style: solid; border-width: 0 0 7px 7px;
  border-color: transparent transparent var(--rule) transparent;
}
.pf-doc-row.has-file .file-type { background: var(--status-ok-soft); border-color: var(--status-ok); color: var(--status-ok); }

/* ---------- Risk matrix refinement ---------- */
.risk-table thead th { position: sticky; top: 0; z-index: 2; }
.risk-table tbody tr:hover { background: var(--surface-2); }
.severity {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
}
.severity::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
}
.risk-note-cell { padding: 6px !important; min-width: 160px; }
.risk-note-cell textarea {
  width: 100%; min-height: 30px; font-size: 11px; padding: 4px 6px;
  background: var(--surface-2); border: 1px solid var(--rule); border-radius: 4px;
  resize: vertical; font-family: var(--sans); color: var(--ink-2);
}
.risk-note-cell textarea:focus { outline: none; border-color: var(--brand); background: var(--surface); }

/* ---------- Sign-off footer (4-level ladder) ---------- */
.signoff {
  margin-top: 22px; padding: 18px 20px;
  background: linear-gradient(180deg, var(--gold-soft) 0%, var(--surface-2) 100%);
  border-top: 2px solid var(--gold);
  border-radius: 0 0 10px 10px;
}
.signoff .title {
  font-family: var(--serif); font-size: 14px; color: var(--gold-deep);
  font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.signoff .title::before { content: "🔏"; font-size: 16px; }
.signoff .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 720px) { .signoff .row { grid-template-columns: 1fr 1fr; } }
.signoff-cell {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; padding: 12px 14px; text-align: center;
  position: relative; min-height: 88px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
}
.signoff-cell.signed { border-color: var(--status-ok); background: var(--status-ok-soft); }
.signoff-cell .role {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  color: var(--ink-3); text-transform: uppercase;
}
.signoff-cell.signed .role { color: var(--status-ok); }
.signoff-cell .name { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 4px 0 2px; }
.signoff-cell .ts { font-size: 10px; color: var(--ink-mute); font-family: var(--mono); }
.signoff-cell button.sign-btn {
  background: var(--brand); color: var(--gold-soft); border: 0;
  padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.signoff-cell button.sign-btn:hover { background: var(--brand-2); }
.signoff-cell.signed::after {
  content: "✓"; position: absolute; inset-inline-end: 8px; inset-block-start: 8px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--status-ok); color: white; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* ---------- Meeting minutes polish ---------- */
.meeting-section { padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 10px; transition: border-color 0.15s; }
.meeting-section:focus-within { border-color: var(--brand); }
.meeting-section .heading { display: flex; align-items: center; gap: 8px; }
.meeting-section .heading .num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--brand-tint); color: var(--brand);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; font-family: var(--mono); flex-shrink: 0;
}
.meeting-section textarea { border: 0; padding: 8px 0 0; background: transparent; }
.meeting-section textarea:focus { background: transparent; box-shadow: none; }

/* ---------- Stepper polish ---------- */
.steps .step { transition: background 0.18s, border-color 0.18s; }
.steps .step.done .num::after, .steps .step.active .num::after { content: ""; }

/* ---------- Buttons polish ---------- */
.btn { transition: background 0.15s, transform 0.05s, box-shadow 0.15s; box-shadow: 0 1px 0 rgba(0,0,0,0.04); }
.btn:hover { box-shadow: 0 2px 6px rgba(20, 48, 37, 0.16); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- Toast polish ---------- */
#toast {
  background: linear-gradient(180deg, var(--brand) 0%, var(--brand-2) 100%) !important;
  border: 1px solid var(--gold);
  box-shadow: 0 6px 18px rgba(0,0,0,0.22);
  font-size: 11px !important; padding: 8px 14px !important;
}

/* ---------- Mobile responsiveness sweep ---------- */
@media (max-width: 880px) {
  .page { padding: 18px 16px 60px; }
  .topbar { padding: 8px 14px; gap: 10px; }
  .topbar nav { display: none; }
  .topbar .date-block { display: none; }
  h1.page-title { font-size: 24px; }
  .kpi-row { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi .value { font-size: 26px; }
  .dash-toolbar { flex-wrap: wrap; gap: 10px; }
  .tb-table { font-size: 12px; }
  .tb-table td.mapping select { max-width: 160px; }
  .tree-row { padding: 12px 14px; }
  .tree-body { padding-inline-start: 24px; padding-inline-end: 14px; }
  .ic-question { padding: 10px 12px; }
  .ic-q-top { flex-wrap: wrap; }
  .ic-answer { min-width: 100%; }
  .ic-q-bottom { flex-direction: column; }
  .ic-q-bottom .note-slot textarea { width: 100%; }
}

/* ============================================================
   PRINT — A4 engagement-memo style
   ============================================================ */
@media print {
  @page { size: A4 portrait; margin: 16mm 14mm 18mm; }
  body { background: white !important; }
  body::before { display: none; }
  .topbar, .subbar, .login-page,
  .btn, .btn-row, .upload-zone, #toast,
  .dash-toolbar, .steps, .ic-q-bottom .upload-btn,
  .tree-row .twist, .sub-node .twist,
  input[type=file] { display: none !important; }
  .page { max-width: none; padding: 0; }
  .sheet { box-shadow: none !important; border: 1px solid #d0c8b0 !important; page-break-inside: avoid; }
  .wp-header { page-break-inside: avoid; border-radius: 0; }
  .tree-node { page-break-inside: avoid; }
  .tree-row { background: white !important; }
  .tree-body { display: block !important; }
  .ic-question { page-break-inside: avoid; border: 1px solid #d0c8b0 !important; }
  .ic-q-bottom { display: flex !important; }
  .signoff { page-break-inside: avoid; background: white !important; }
  .signoff-cell { background: white !important; border: 1px solid #d0c8b0 !important; }
  .risk-table { page-break-inside: avoid; }
  .risk-table tbody tr { page-break-inside: avoid; }
  h1.page-title { page-break-after: avoid; }
  h2.section-title, h3.sub-title { page-break-after: avoid; }
  a { color: inherit; text-decoration: none; }
}
</style>

    const parsed = JSON.parse(raw);
    return { ...structuredClone(DEFAULT_STATE), ...parsed };
  } catch (e) {
    console.warn("loadState failed, using defaults", e);
    return structuredClone(DEFAULT_STATE);
  }
}

function navigate(path) {

  if (!state.auth && route() !== "/") {
    navigate("/");

function render() {
  const path = route();

  if (!state.auth) { app.innerHTML = viewLogin(); afterRender(); return; }

  let html = renderTopbar(path);

    html += renderSubbar({ crumb: ["الرئيسية"] });

function calcPlanningProgress(c) {
  let total = 0, done = 0;
  // IC sections
  for (const sec of PLANNING_SECTIONS) {
    if (sec.kind === "ic") {
      const bankSec = DATA.icBank.find(b => b.key === sec.key);
      if (!bankSec) continue;
      for (const sub of bankSec.subsections) {
        for (const q of sub.questions) {
          total++;
          if (c.planning[sec.key]?.answers?.[q.id]?.value) done++;
        }
      }
    } else if (sec.kind === "meeting") {
      total += DATA.meeting.sections.length;
      done  += Object.keys(c.planning.meeting_minutes.sections || {}).filter(k => c.planning.meeting_minutes.sections[k]).length;
    } else if (sec.kind === "permanent") {
      total += DATA.permanent.questions.length + DATA.permanent.documents.length + 1; // +1 entity size
      if (c.planning.permanent_file.entitySize) done++;
      done += Object.values(c.planning.permanent_file.questions || {}).filter(v => v && v.text).length;
      done += Object.values(c.planning.permanent_file.documents || {}).filter(v => v && v.fileName).length;
    } else if (sec.kind === "risk") {
      const rows = countMappedRisks(c);
      total += rows;
      done  += Object.keys(c.planning.risk_assessment.responses || {}).length;
    }
  }
  if (total === 0) return 0;
  return Math.round((done / total) * 100);
}

function countMappedRisks(c) {
  if (!c.tb || !c.tb.uploaded) return 0;
  const mappedAreas = new Set(c.tb.rows.map(r => r.mapping).filter(Boolean));
  let n = 0;
  for (const sec of DATA.risk.sections) {
    for (const acct of sec.accounts) {
      if (mappedAreas.has(acct.areaCode) || (acct.areaCode && acct.areaCode.split("-").some(a => mappedAreas.has(a)))) {
        n += acct.risks.length;
      }
    }
  }
  return n;
}

function viewTBMapping(c) {
  const totalDr = c.tb.rows.reduce((s, r) => s + Number(r.dr || 0), 0);

  const mappedCount = c.tb.rows.filter(r => r.mapping).length;
  const unmappedCount = c.tb.rows.length - mappedCount;
  const balanced = Math.abs(totalDr - totalCr) < 0.5;

  return `

      <h1 class="page-title">ميزان المراجعة · التصنيف
        <small>صنّف كل حساب على أحد رموز دليل الحسابات. يتم استخدام التصنيف لاحقاً في تقييم المخاطر والتنفيذ.</small>

        <div class="step active"><div class="num">3</div>التصنيف (${mappedCount}/${c.tb.rows.length})</div>
      </div>

      <div class="sheet tight" style="display:flex; align-items:center; gap:16px;">
        <span class="pill ${balanced ? "ok" : "bad"}">${balanced ? "متوازن" : "غير متوازن"}</span>
        <span>المدين: <strong class="tnum">${fmt(totalDr)}</strong></span>
        <span>الدائن: <strong class="tnum">${fmt(totalCr)}</strong></span>

function viewPlanning(c) {
  const ui = c.ui.planningOpen || {};
  const progress = calcPlanningProgress(c);
  return `
    <main class="page">
      <div class="flex-between" style="margin-bottom:14px; gap:14px; flex-wrap:wrap;">
        <h1 class="page-title" style="margin-bottom:0;">مرحلة التخطيط
          <small>ISA 220 · ISA 210 · ISA 300 · ISA 315 — اضغط على كل قسم لتوسيعه</small>
        </h1>
        <div class="flex gap-8" style="align-items:center;">
          <div class="pill ${progress === 100 ? "ok" : progress >= 50 ? "warn" : "muted"}">${progress}% من التخطيط مُكتمل</div>
          <button class="btn ghost sm" data-action="printPage">معاينة وطباعة</button>
          <button class="btn sm" data-action="expandAll">فتح الكل</button>
        </div>
      </div>

      ${!c.tb.uploaded ? `
        <div class="callout" style="margin-bottom: 20px;">
          <strong>ميزان المراجعة غير مُحمَّل بعد.</strong> بعض الإجراءات (مثل تقييم المخاطر) تعتمد على تصنيف الميزان.

        </div>
      ` : ""}

      <div class="tree">
        ${PLANNING_SECTIONS.map(sec => renderPlanningSection(c, sec, ui[sec.key])).join("")}

}

function renderPlanningSection(c, sec, open) {
  const isOpen = !!open;
  const progress = sectionProgress(c, sec);
  const body = isOpen ? `
    ${renderWPHeader(c, { isa: sec.isa, title: sec.title.replace(/^\d+\s*·\s*/, "") })}
    ${renderPlanningBody(c, sec)}
    ${renderSignoff(c, sec.key)}
  ` : "";
  return `
    <div class="tree-node">
      <div class="tree-row ${isOpen ? "open" : ""}" onclick="handlers.togglePlanning('${c.id}', '${sec.key}')">
        <span class="twist">▶</span>
        <span class="label">
          ${esc(sec.title)}
          <span class="badge">${esc(sec.isa)}</span>
        </span>
        <span class="progress">
          <span class="mini-bar"><span class="fill" style="width:${progress.pct}%;"></span></span>
          <span>${progress.done} / ${progress.total} · <strong>${progress.pct}%</strong></span>
        </span>
      </div>
      <div class="tree-body" ${isOpen ? "" : 'style="display:none"'}>${body}</div>
    </div>
  `;
}

function sectionProgress(c, sec) {
  let total = 0, done = 0;
  if (sec.kind === "ic") {
    const bankSec = DATA.icBank.find(b => b.key === sec.key);
    if (bankSec) {
      for (const sub of bankSec.subsections) {
        for (const q of sub.questions) {
          total++;
          if (c.planning[sec.key]?.answers?.[q.id]?.value) done++;
        }
      }
    }
  } else if (sec.kind === "meeting") {
    total = DATA.meeting.sections.length;
    done  = Object.keys(c.planning.meeting_minutes.sections || {}).filter(k => c.planning.meeting_minutes.sections[k]).length;
  } else if (sec.kind === "permanent") {
    total = DATA.permanent.questions.length + DATA.permanent.documents.length + 1;
    if (c.planning.permanent_file.entitySize) done++;
    done += Object.values(c.planning.permanent_file.questions || {}).filter(v => v && v.text).length;
    done += Object.values(c.planning.permanent_file.documents || {}).filter(v => v && v.fileName).length;
  } else if (sec.kind === "risk") {
    total = countMappedRisks(c);
    done  = Object.keys(c.planning.risk_assessment.responses || {}).length;
  }
  return { total, done, pct: total ? Math.round(100 * done / total) : 0 };
}

function renderPlanningBody(c, sec) {
  if (sec.kind === "ic")        return renderICSection(c, sec);
  if (sec.kind === "meeting")   return renderMeetingMinutes(c);
  if (sec.kind === "permanent") return renderPermanentFile(c);
  if (sec.kind === "risk")      return renderRiskMatrix(c);
  return `<p class="subtle">قيد التطوير.</p>`;
}

// ----- IC section: subsections expand into question lists -----
function renderICSection(c, sec) {
  const bankSec = DATA.icBank.find(b => b.key === sec.key);
  if (!bankSec) return `<p class="subtle">لا توجد إجراءات بعد.</p>`;
  const subOpen = (c.ui.subOpen || {})[sec.key] || {};
  return `
    <div class="sub-tree">
      ${bankSec.subsections.map((sub, idx) => {
        const isOpen = !!subOpen[idx];
        const subDone = sub.questions.filter(q => c.planning[sec.key]?.answers?.[q.id]?.value).length;
        return `
          <div>
            <div class="sub-node ${isOpen ? "open" : ""}" onclick="handlers.toggleSub('${c.id}', '${sec.key}', ${idx})">
              <span class="twist">▶</span>
              <span class="sub-node-label">${esc(sub.heading)}</span>
              <span class="progress code">${subDone}/${sub.questions.length}</span>
            </div>
            <div class="sub-body" ${isOpen ? "" : 'style="display:none"'}>
              <div class="ic-list">
                ${sub.questions.map((q, qi) => renderICQuestion(c, sec.key, q, qi + 1)).join("")}
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderICQuestion(c, secKey, q, num) {
  const a = c.planning[secKey]?.answers?.[q.id] || { value: "", file: null, note: "" };
  const value = a.value || "";
  const isYes = value === "exists" || value === "applies";
  const isNo  = value === "not_exists" || value === "not_applies";
  const cls = isYes ? "answered-yes" : isNo ? "answered-no" : value ? "answered-na" : "";
  const selClass = isYes ? "yes" : isNo ? "no" : value ? "na" : "";
  const missingUpload = isYes && !a.file?.fileName;
  return `
    <div class="ic-question ${cls} ${missingUpload ? "no-upload" : ""}" data-qid="${q.id}">
      <div class="ic-q-top">
        <span class="ic-q-num">${num}</span>
        <div class="ic-q-text">${esc(q.text)}
          <span class="ic-warn-pill">⚠ المستند المؤيد مفقود</span>
        </div>
        <div class="ic-answer">
          <select class="${selClass}" onchange="handlers.setAnswer('${c.id}', '${secKey}', '${q.id}', this.value)">
            <option value="">— الإجابة —</option>
            <option value="exists"      ${value==="exists"?"selected":""}>يوجد</option>
            <option value="not_exists"  ${value==="not_exists"?"selected":""}>لا يوجد</option>
            <option value="applies"     ${value==="applies"?"selected":""}>ينطبق</option>
            <option value="not_applies" ${value==="not_applies"?"selected":""}>لا ينطبق</option>
          </select>
        </div>
      </div>
      <div class="ic-q-bottom">
        <label class="upload-slot ${a.file?.fileName ? "has-file" : ""}">
          <span class="file-icon">📎</span>
          <span>${a.file?.fileName ? "تم إرفاق: " + esc(a.file.fileName) : "ارفق المستند المؤيد للإجابة"}</span>
          <input type="file" onchange="handlers.attachFile('${c.id}','${secKey}','${q.id}', this.files[0])" />
          <span class="upload-btn">${a.file?.fileName ? "استبدال" : "اختر ملف"}</span>
        </label>
        <div class="note-slot">
          <textarea placeholder="ملاحظة (اختياري)" onchange="handlers.setNote('${c.id}','${secKey}','${q.id}', this.value)">${esc(a.note || "")}</textarea>
        </div>
      </div>
    </div>
  `;
}

// ----- Meeting minutes -----
function renderMeetingMinutes(c) {
  const mm = c.planning.meeting_minutes;
  const intro = DATA.meeting.intro
    .replace("{meeting_date}", `<input type="date" value="${esc(mm.meetingDate || "")}" onchange="handlers.setMeetingDate('${c.id}', this.value)" style="background:transparent;border:0;border-bottom:1px dashed var(--gold-deep);font-family:var(--mono)" />`)
    .replace("{contact_name}", `<input value="${esc(mm.contactName || "")}" placeholder="اسم رئيس الحسابات" onchange="handlers.setMeetingContact('${c.id}', this.value)" style="background:transparent;border:0;border-bottom:1px dashed var(--gold-deep)" />`);
  return `
    <div class="sheet" style="margin:0;">
      <div class="meeting-intro">${intro}</div>
      ${DATA.meeting.sections.map((sec, idx) => `
        <div class="meeting-section">
          <div class="heading"><span class="num">${idx + 1}</span> ${esc(sec.heading || "—")}</div>
          <textarea placeholder="اكتب أو ألصق نص الفقرة هنا..." onchange="handlers.setMeetingSection('${c.id}', ${idx}, this.value)">${esc((mm.sections || {})[idx] ?? sec.body ?? "")}</textarea>
        </div>
      `).join("")}

        <button class="btn ghost sm" data-action="printMeeting">معاينة وطباعة</button>
      </div>

}

// ----- Permanent file -----
function renderPermanentFile(c) {
  const pf = c.planning.permanent_file;
  const groupedQs = {};
  for (const q of DATA.permanent.questions) {
    (groupedQs[q.section] = groupedQs[q.section] || []).push(q);
  }
  return `
    <div class="sheet" style="margin:0;">
      <h3 class="sub-title">تصنيف المنشأة</h3>
      <p class="subtle">حدد حجم المنشأة بحسب المعايير التالية:</p>
      <div class="entity-classes">
        ${DATA.permanent.entityClassification.map(ec => {
          const icon = ec.size === "large" ? "🏛" : ec.size === "medium_small" ? "🏢" : "🏪";
          const sizeLabel = ec.size === "large" ? "كبيرة" : ec.size === "medium_small" ? "متوسطة / صغيرة" : "صغيرة جداً";
          return `
            <div class="entity-class ${pf.entitySize === ec.size ? "selected" : ""}" onclick="handlers.setEntitySize('${c.id}', '${ec.size}')">
              <span class="icon">${icon}</span>
              <div class="size">${sizeLabel}</div>
              <div class="criteria">${esc(ec.criteria)}</div>
            </div>
          `;
        }).join("")}
      </div>

      ${Object.entries(groupedQs).map(([sectionTitle, qs]) => `
        <h3 class="sub-title">${esc(sectionTitle || "أسئلة")}</h3>
        ${qs.map(q => `
          <div class="field">
            <label>${esc(q.text)}</label>
            <textarea rows="2" onchange="handlers.setPfQ('${c.id}', '${q.id}', this.value)">${esc((pf.questions || {})[q.id]?.text || "")}</textarea>
          </div>
        `).join("")}
      `).join("")}

      <h3 class="sub-title">المستندات المطلوبة</h3>
      <p class="subtle" style="margin-top:-4px;">هذه المستندات تبقى في الملف الدائم وتُستخدم عبر السنوات المتعاقبة.</p>
      ${DATA.permanent.documents.map(d => {
        const slot = (pf.documents || {})[d.id];
        const has = !!slot?.fileName;
        const ext = has ? (slot.fileName.split(".").pop() || "").toUpperCase().slice(0,3) : "PDF";
        return `
          <label class="pf-doc-row ${has ? "has-file" : ""}">
            <span class="file-type">${ext || "DOC"}</span>
            <span class="label">${esc(d.label)}</span>
            <span class="subtle">${has ? "تم: " + esc(slot.fileName) : "لم يُرفق بعد"}</span>
            <input type="file" onchange="handlers.attachPfDoc('${c.id}', '${d.id}', this.files[0])" />
            <span class="btn sm">${has ? "استبدال" : "إرفاق"}</span>
          </label>
        `;
      }).join("")}
    </div>
  `;
}

// ----- Risk matrix (TB-filtered) -----
function renderRiskMatrix(c) {
  if (!c.tb.uploaded) {
    return `
      <div class="risk-empty">
        تقييم المخاطر يعتمد على ميزان المراجعة المصنف. <a href="#/c/${c.id}/tb">→ افتح الميزان أولاً</a>
      </div>
    `;
  }
  const mappedAreas = new Set(c.tb.rows.map(r => r.mapping).filter(Boolean));
  if (mappedAreas.size === 0) {
    return `<div class="risk-empty">لم يُصنَّف أي حساب بعد في الميزان.</div>`;
  }

  const sections = DATA.risk.sections.map(sec => ({
    ...sec,
    accounts: sec.accounts.filter(acct => {
      if (!acct.areaCode) return false;
      return acct.areaCode.split("-").some(a => mappedAreas.has(a));
    }),
  })).filter(sec => sec.accounts.length > 0);

  if (sections.length === 0) {
    return `<div class="risk-empty">لا توجد بنود ميزان تطابق فئات المخاطر المعرّفة. تحقق من تصنيف الحسابات.</div>`;
  }

  return `
    <div class="sheet" style="margin:0;">
      <p class="subtle">المصفوفة أدناه تعرض فقط فئات المخاطر التي يحتوي ميزانك على حسابات مصنفة ضمنها (مجموع <strong>${sections.reduce((s, x) => s + x.accounts.length, 0)}</strong> حساب).</p>
      ${sections.map(sec => `
        <div class="risk-section">
          <h3>${esc(sec.name)}</h3>
          <table class="risk-table">
            <thead>
              <tr>
                ${DATA.risk.columns.map(col => `<th>${esc(col.label)}</th>`).join("")}
                <th style="width:140px;">ملاحظة المدقق</th>
                <th style="width:90px;">الاستجابة</th>
              </tr>
            </thead>
            <tbody>
              ${sec.accounts.map(acct => `
                <tr class="acct-row"><td colspan="${DATA.risk.columns.length + 2}">${esc(acct.name)} <span class="code">(${esc(acct.areaCode || "—")})</span></td></tr>
                ${acct.risks.map((r, ri) => {
                  const rid = `${acct.areaCode}_${acct.name.slice(0,12)}_${ri}`;
                  const checked = !!(c.planning.risk_assessment.responses || {})[rid];
                  const note = (c.planning.risk_assessment.notes || {})[rid] || "";
                  return `
                    <tr>
                      <td>${esc(r.description)}</td>
                      <td>${esc(r.assertion)}</td>
                      <td>${esc(r.type)}</td>
                      <td><span class="severity ${esc(r.severity || "M")}">${esc(r.severity || "M")}</span></td>
                      <td>${esc(r.response)}</td>
                      <td class="risk-note-cell"><textarea placeholder="ملاحظة" onchange="handlers.setRiskNote('${c.id}','${rid}', this.value)">${esc(note)}</textarea></td>
                      <td><label style="display:flex;align-items:center;gap:6px;font-size:11px;"><input type="checkbox" ${checked?"checked":""} onchange="handlers.toggleRisk('${c.id}','${rid}', this.checked)" />تمت</label></td>
                    </tr>
                  `;
                }).join("")}
              `).join("")}
            </tbody>
          </table>
        </div>
      `).join("")}
    </div>
  `;
}

const handlers = {
  login(ev) {
    const f = new FormData(ev.target);
    state.auth = { username: f.get("username"), displayName: f.get("username") };
    saveState();
    navigate("/home");
  },
  logout() {
    if (!confirm("تسجيل الخروج؟ ستبقى البيانات محفوظة محلياً.")) return;
    state.auth = null;
    saveState();
    navigate("/");
  },
  quickDemo() {
    state.auth = { username: "yazan", displayName: "يزن العمري" };
    state.auditor = { preparedBy: "يزن العمري", reviewer: "—", firmName: "مكتب الخليج للمحاسبة والتدقيق", license: "QFMA-2026" };
    seedSampleClient();
    saveState();
    navigate("/home");
  },
  loadSample() {
    seedSampleClient();
    saveState();
    navigate("/home");
    setTimeout(() => render(), 30);
  },
  setYearFilter(v) { state.ui.yearFilter = v; saveState(); render(); },
  setSearch(v) { state.ui.search = v; saveState(); render(); },
  saveSetup(ev, editId) {
    const f = new FormData(ev.target);
    // Auditor
    state.auditor = {
      preparedBy: f.get("preparedBy") || "",
      reviewer:   f.get("reviewer") || "",
      firmName:   f.get("firmName") || "",
      license:    f.get("license") || "",
    };
    // Parse partners
    const partnersRaw = String(f.get("partnersRaw") || "");
    const partners = partnersRaw.split("\n").map(line => line.trim()).filter(Boolean).map(line => {
      const [name, share] = line.split("·").map(s => s.trim());
      return { name, share: share || "" };
    });
    const clientData = {
      nameAr: f.get("nameAr") || "",
      nameEn: f.get("nameEn") || "",
      crNumber: f.get("crNumber") || "",
      legalForm: f.get("legalForm") || "llc",
      capital: f.get("capital") || "",
      currency: "QAR",
      partners,
      fyStart: f.get("fyStart") || "",
      fyEnd: f.get("fyEnd") || "",
      engagementYear: Number(f.get("engagementYear")) || new Date().getFullYear(),
    };
    if (editId) {
      const idx = state.clients.findIndex(c => c.id === editId);
      if (idx >= 0) state.clients[idx] = { ...state.clients[idx], ...clientData };
      state.currentClientId = editId;
    } else {
      const c = blankClient(clientData);
      state.clients.push(c);
      state.currentClientId = c.id;
    }
    saveState();
    navigate("/c/" + state.currentClientId + "/tb");
  },
  togglePlanning(cid, key) {
    const c = state.clients.find(x => x.id === cid);
    c.ui.planningOpen = c.ui.planningOpen || {};
    c.ui.planningOpen[key] = !c.ui.planningOpen[key];
    saveState(); render();
  },
  toggleSub(cid, secKey, idx) {
    const c = state.clients.find(x => x.id === cid);
    c.ui.subOpen = c.ui.subOpen || {};
    c.ui.subOpen[secKey] = c.ui.subOpen[secKey] || {};
    c.ui.subOpen[secKey][idx] = !c.ui.subOpen[secKey][idx];
    saveState(); render();
  },
  setAnswer(cid, secKey, qid, value) {
    const c = state.clients.find(x => x.id === cid);
    c.planning[secKey].answers = c.planning[secKey].answers || {};
    const prev = c.planning[secKey].answers[qid] || {};
    c.planning[secKey].answers[qid] = { ...prev, value };
    saveState(); render();
  },
  attachFile(cid, secKey, qid, file) {
    if (!file) return;
    const c = state.clients.find(x => x.id === cid);
    c.planning[secKey].answers = c.planning[secKey].answers || {};
    const prev = c.planning[secKey].answers[qid] || {};
    // localStorage stub — store filename + size only, not bytes
    c.planning[secKey].answers[qid] = { ...prev, file: { fileName: file.name, size: file.size } };
    saveState(); render();
  },
  setNote(cid, secKey, qid, note) {
    const c = state.clients.find(x => x.id === cid);
    c.planning[secKey].answers = c.planning[secKey].answers || {};
    const prev = c.planning[secKey].answers[qid] || {};
    c.planning[secKey].answers[qid] = { ...prev, note };
    saveState();
  },
  setMeetingDate(cid, v) { const c = state.clients.find(x => x.id === cid); c.planning.meeting_minutes.meetingDate = v; saveState(); },
  setMeetingContact(cid, v) { const c = state.clients.find(x => x.id === cid); c.planning.meeting_minutes.contactName = v; saveState(); },
  setMeetingSection(cid, idx, v) {
    const c = state.clients.find(x => x.id === cid);
    c.planning.meeting_minutes.sections = c.planning.meeting_minutes.sections || {};
    c.planning.meeting_minutes.sections[idx] = v;
    saveState();
  },
  setEntitySize(cid, size) {
    const c = state.clients.find(x => x.id === cid);
    c.planning.permanent_file.entitySize = size;
    saveState(); render();
  },
  setPfQ(cid, qid, text) {
    const c = state.clients.find(x => x.id === cid);
    c.planning.permanent_file.questions = c.planning.permanent_file.questions || {};
    c.planning.permanent_file.questions[qid] = { text };
    saveState();
  },
  attachPfDoc(cid, did, file) {
    if (!file) return;
    const c = state.clients.find(x => x.id === cid);
    c.planning.permanent_file.documents = c.planning.permanent_file.documents || {};
    c.planning.permanent_file.documents[did] = { fileName: file.name, size: file.size };
    saveState(); render();
  },
  toggleRisk(cid, rid, on) {
    const c = state.clients.find(x => x.id === cid);
    c.planning.risk_assessment.responses = c.planning.risk_assessment.responses || {};
    if (on) c.planning.risk_assessment.responses[rid] = { signed: true, at: nowISO() };
    else delete c.planning.risk_assessment.responses[rid];
    saveState();
  },
  setRiskNote(cid, rid, note) {
    const c = state.clients.find(x => x.id === cid);
    c.planning.risk_assessment.notes = c.planning.risk_assessment.notes || {};
    if (note) c.planning.risk_assessment.notes[rid] = note;
    else delete c.planning.risk_assessment.notes[rid];
    saveState();
  },
  sign(cid, secKey, roleKey) {
    const c = state.clients.find(x => x.id === cid);
    c.planning[secKey].signoff = c.planning[secKey].signoff || {};
    const name = (state.auditor && state.auditor.preparedBy) || (state.auth && state.auth.displayName) || "—";
    c.planning[secKey].signoff[roleKey] = { name, at: nowISO() };
    saveState(); render();
  },
  unsign(cid, secKey, roleKey) {
    const c = state.clients.find(x => x.id === cid);
    if (!c.planning[secKey].signoff) return;
    delete c.planning[secKey].signoff[roleKey];
    saveState(); render();
  },
  printPage() { window.print(); },
  loadSampleTB(ev, el) {
    if (!state.currentClientId) return;
    const c = state.clients.find(x => x.id === state.currentClientId);
    c.tb.uploaded = true;
    c.tb.rows = DATA.sampleTb.map(r => ({ ...r, mapping: DATA.sampleMap[r.code] || "" }));
    saveState(); render();
  },
  tbFileUpload(ev) {
    alert("استيراد ملف Excel/CSV لم يُفعَّل بعد في النسخة المبدئية. استخدم 'تعبئة من بيانات تجريبية' لرؤية شاشة التصنيف.");
  },
  downloadTbTemplate() {
    const headers = ["code","name","dr","cr"];
    const csv = headers.join(",") + "\n" + "1010,النقد بالصندوق,0,0\n1020,البنوك التجارية,0,0\n1110,ذمم العملاء,0,0\n";
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "TB-template.csv"; a.click();
    URL.revokeObjectURL(url);
  },
  setMapping(cid, idx, val) {
    const c = state.clients.find(x => x.id === cid);
    c.tb.rows[idx].mapping = val;
    saveState();
    // surgical re-render: just update the select class
    const selects = $$(".tb-table td.mapping select");
    if (selects[idx]) selects[idx].className = val ? "mapped" : "unmapped";
  },
  resetTb() {
    if (!confirm("هل تريد إعادة تعيين الميزان وإزالة كل التصنيفات؟")) return;
    const c = currentClient();
    c.tb = { uploaded: false, rows: [] };
    saveState(); render();
  },
  printMeeting() { window.print(); },
  expandAll() {
    const c = currentClient(); if (!c) return;
    const allOpen = PLANNING_SECTIONS.every(s => c.ui.planningOpen?.[s.key]);
    c.ui.planningOpen = {};
    if (!allOpen) {
      for (const s of PLANNING_SECTIONS) c.ui.planningOpen[s.key] = true;
    }
    saveState(); render();
  },
};

// ============================================================
// Seed sample client (realistic Qatari construction co)
// ============================================================
function seedSampleClient() {
  const exists = state.clients.find(c => c.crNumber === "85432" && c.engagementYear === 2025);
  if (exists) { state.currentClientId = exists.id; return; }
  const c = blankClient({
    nameAr: "شركة الخليج للمقاولات ذ.م.م",
    nameEn: "Gulf Contracting LLC",
    crNumber: "85432",
    legalForm: "llc",
    activityType: "construction",
    capital: "5,000,000 ر.ق",
    partners: [
      { name: "محمد علي الراشد", share: "60%" },
      { name: "أحمد خالد الكواري", share: "40%" },
    ],
    fyStart: "2025-01-01",
    fyEnd: "2025-12-31",
    engagementYear: 2025,
  });
  // Pre-load TB
  c.tb.uploaded = true;
  c.tb.rows = DATA.sampleTb.map(r => ({ ...r, mapping: DATA.sampleMap[r.code] || "" }));
  // Open Planning's first section by default so users see how the tree expands
  c.ui.planningOpen = { client_acceptance: true };
  state.clients.push(c);
  state.currentClientId = c.id;
}

// ============================================================
// Auto-save toast
// ============================================================
function flashSaved() {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;bottom:18px;inset-inline-start:18px;background:var(--brand);color:var(--gold-soft);padding:6px 14px;border-radius:6px;font-size:11px;font-family:var(--mono);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;";
    document.body.appendChild(t);
  }
  t.textContent = "✓ تم الحفظ تلقائياً · " + new Date().toLocaleTimeString("ar-EG");
  t.style.opacity = "1";
  clearTimeout(flashSaved._h);
  flashSaved._h = setTimeout(() => t.style.opacity = "0", 1600);
}

// Expose for inline handlers
window.handlers = handlers;
window.navigate = navigate;
